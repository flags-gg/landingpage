name: Deploy Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.66.0
      - name: Deploy to production
        # Project token: scoped to this project + environment, no `railway link` needed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --project a53fbabb-c9f2-4a1c-81e7-653521f3bb70 --service frontend --environment production --detach
